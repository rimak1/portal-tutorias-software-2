# Configuracion de Nginx con HTTPS. Se usa junto con docker-compose.tls.yml (ver README).
# Los certificados (fullchain.pem y privkey.pem) se montan desde ./certs y no se versionan.

server {
    listen 80;
    server_name _;

    # Todo el trafico HTTP se redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Los navegadores recordaran usar solo HTTPS con este dominio durante seis meses.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /api/ {
        # La API ya envia HSTS en produccion; se evita duplicar la cabecera.
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Al declarar add_header aqui, Nginx deja de heredar el del servidor: se repite HSTS.
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
