server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API reenvia la IP del cliente para limitar intentos de acceso. Se SOBRESCRIBE
    # X-Forwarded-For (no se agrega): asi un cliente no puede declarar la IP que quiera.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La SPA: cabeceras de seguridad (la API agrega las suyas). Los estilos en linea y las
    # fuentes de Google son los unicos origenes externos que usa la interfaz.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
