name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_tutorias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_tutorias_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_tutorias_test?schema=public
      SESSION_SECRET: ci-session-secret-solo-para-pruebas
      RESET_TOKEN_SECRET: ci-reset-secret-solo-para-pruebas
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace @portal-tutorias/shared

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace @portal-tutorias/api

      - name: Aplicar migraciones
        run: npm run prisma:deploy --workspace @portal-tutorias/api

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build --workspace apps/web

      - run: npm run test

  # Las imagenes del despliegue tambien se construyen en cada cambio: una dependencia que falta
  # o un Dockerfile roto solo se notarian el dia del despliegue.
  docker-build:
    runs-on: ubuntu-latest

    env:
      SESSION_SECRET: ci-session-secret-solo-para-pruebas
      RESET_TOKEN_SECRET: ci-reset-secret-solo-para-pruebas

    steps:
      - uses: actions/checkout@v4

      - name: Construir las imagenes
        run: docker compose build

      - name: Validar la configuracion de Nginx (HTTP)
        run: >
          docker run --rm --add-host api:127.0.0.1
          -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t
